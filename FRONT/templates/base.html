<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema Universitario{% endblock %}</title>
    
    <!-- Vinculación al CSS global mediante Flask -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/global.css') }}">
</head>
<body>

    <!-- Menú superior de navegación -->
    <header>
        <nav>
            <strong>Panel Docente</strong>
            <ul>
                <li><a href="{{ url_for('panel_principal') }}">Inicio</a></li>
                <li><a href="{{ url_for('seccion_alumnos') }}">Alumnos y Notas</a></li>
            </ul>
        </nav>
    </header>

    <!-- El contenido de cada página se inyectará aquí -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Pie de página -->
    <footer>
        <p>&copy; 2026 - Introducción al Desarrollo de Software - Grupo 7</p>
    </footer>

</body>
</html>
