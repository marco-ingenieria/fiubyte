<!DOCTYPE html>
<html lang="es">
<html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema Universitario{% endblock %}</title>
    <!-- Conexión al CSS potente -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style/global.css') }}">
</head>
<body>

    <!-- Menú con ID simple -->
    <div id="menu-superior">
        <strong>Panel Docente</strong>
        <ul>
            <li><a href="{{ url_for('panel_principal') }}">Inicio</a></li>
            <li><a href="{{ url_for('seccion_alumnos') }}">Alumnos y Notas</a></li>
        </ul>
    </div>

    <!-- Caja contenedora general de las páginas -->
    <div id="contenedor-principal">
        {% block content %}{% endblock %}
    </div>

    <!-- Pie de página simple con etiqueta footer que te dieron en el ejemplo -->
    <footer>
        <p>2026 - Introducción al Desarrollo de Software - Grupo 7</p>
        <p id="texto-footer">
            Facultad de Ingeniería - UBA
        </p>
    </footer>

</body>
</html>
