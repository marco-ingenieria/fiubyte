services:
  mysql:
    image: mysql:8
    container_name: fiubyte_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-fiubyte}
    ports:
      - "${DB_PORT_EXTERNAL:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./BACK/db/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro

  # backend:
  #   build: ./BACK
  #   container_name: fiubyte_backend
  #   restart: unless-stopped
  #   ports:
  #     - "${FLASK_PORT:-5000}:5000"
  #   volumes:
  #     - ./BACK:/app
  #   environment:
  #     FLASK_ENV: development
  #     FLASK_APP: app.py
  #     FLASK_RUN_HOST: 0.0.0.0
  #     DB_HOST: ${DB_HOST}
  #     DB_USER: ${DB_USER}
  #     DB_PASSWORD: ${DB_PASSWORD}
  #     DB_PORT: ${DB_PORT}
  #     DB_NAME: ${DB_NAME}
  #   depends_on:
  #     - mysql

  frontend:
    build: ./FRONT
    container_name: fiubyte_frontend
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-8080}:5000"
    volumes:
      - ./FRONT:/app
    environment:
      FLASK_ENV: development
      FLASK_APP: app.py
      FLASK_RUN_HOST: 0.0.0.0
      # depends_on:
      #   - backend

volumes:
  mysql_data: